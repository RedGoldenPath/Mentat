# M4 — QLoRA fine-tune of qwen3.8:27b (MLX, 4-bit base + LoRA adapters).
# Trains only on the assistant turn (mask_prompt) so the model learns the
# grounded answer contract, not to imitate evidence blocks.
model: models/qwen3.8-27b-4bit
train: true
data: data_final
seed: 42
fine_tune_type: lora
num_layers: 16          # of 64 — upper-block adaptation
batch_size: 1
iters: 2400             # ~1 epoch over the train split
val_batches: 4
learning_rate: 1.0e-5   # QLoRA on a 4-bit base
steps_per_report: 20
steps_per_eval: 200
save_every: 200
clear_cache_threshold: 8
adapter_path: adapters/mentat-v1
max_seq_length: 3072
mask_prompt: true
grad_checkpoint: true
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 16.0
